<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성경 읽기</title>
<style>
  :root {
    --accent: #6d4c2f;
    --bg: #faf7f2;
    --card: #ffffff;
    --border: #e5ddd0;
    --text: #2b2620;
    --muted: #8a8070;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 22px;
    text-align: center;
    margin: 8px 0 20px;
    color: var(--accent);
  }
  .controls {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 12px; color: var(--muted); }
  select {
    padding: 10px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 15px;
    color: var(--text);
  }
  select:disabled { color: var(--muted); background: #f2efe9; }
  .result {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    min-height: 120px;
    line-height: 1.9;
    font-size: 16px;
  }
  .result .ref {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .verse-line {
    margin-bottom: 6px;
    padding: 4px 6px;
    margin-left: -6px;
    margin-right: -6px;
    border-radius: 8px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .verse-line.pressing { background: #f0e6d2; }
  .verse-num {
    color: var(--accent);
    font-weight: 600;
    margin-right: 4px;
  }
  .record-badge {
    color: var(--muted);
    font-size: 13px;
    margin-left: 2px;
  }
  .hidden { display: none !important; }
  .verse-expand {
    margin: 8px 0 4px 18px;
    padding: 10px 12px;
    background: #f7f3ec;
    border-radius: 10px;
    font-size: 14px;
    cursor: default;
  }
  .alt-translation { margin-bottom: 6px; color: #55503f; }
  .alt-label {
    font-weight: 600;
    color: var(--accent);
    margin-right: 6px;
    font-size: 12px;
  }
  .record-section { margin-top: 6px; }
  .record-toggle-btn {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  .record-list { margin-top: 8px; }
  .record-item { padding: 8px 0; border-top: 1px dashed var(--border); }
  .record-item:first-child { border-top: none; }
  .record-meta { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .record-content { white-space: pre-wrap; }
  .placeholder, .error {
    color: var(--muted);
    text-align: center;
    padding: 30px 0;
  }
  .error { color: #b23b3b; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 24, 14, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }
  .modal-box {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 400px;
  }
  .modal-box h3 { margin: 0 0 4px; color: var(--accent); }
  .modal-ref { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .modal-box label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .modal-box input, .modal-box textarea {
    width: 100%;
    margin-top: 4px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 4px;
  }
  .modal-actions button {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  #recordSaveBtn { background: var(--accent); color: #fff; border-color: var(--accent); }
  #recordSaveBtn:disabled { opacity: 0.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📖 성경 읽기</h1>

  <div class="controls">
    <div class="field">
      <label for="translationSelect">번역본</label>
      <select id="translationSelect">
        <option value="개역개정">개역개정</option>
        <option value="새번역">새번역</option>
        <option value="ESV">ESV</option>
      </select>
    </div>
    <div class="field">
      <label for="bookSelect">색인</label>
      <select id="bookSelect">
        <option value="">불러오는 중...</option>
      </select>
    </div>
    <div class="field">
      <label for="chapterSelect">장</label>
      <select id="chapterSelect" disabled>
        <option value="">장 선택</option>
      </select>
    </div>
    <div class="field">
      <label for="verseSelect">절</label>
      <select id="verseSelect" disabled>
        <option value="">절 선택</option>
      </select>
    </div>
  </div>

  <div class="result" id="result">
    <div class="placeholder">색인과 장을 선택하면 말씀을 볼 수 있어요.</div>
  </div>
</div>

<div class="modal-overlay hidden" id="recordModal">
  <div class="modal-box">
    <h3>기록하기</h3>
    <div class="modal-ref" id="recordModalRef"></div>
    <label>날짜<input type="date" id="recordDate"></label>
    <label>기록자<input type="text" id="recordAuthor" placeholder="이름"></label>
    <label>내용<textarea id="recordContent" rows="4" placeholder="이 말씀에 대한 기록을 남겨보세요"></textarea></label>
    <div class="modal-actions">
      <button id="recordCancelBtn" type="button">취소</button>
      <button id="recordSaveBtn" type="button">저장</button>
    </div>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxbaX-v_fqrTCO0SINsHmgbepVfWLna2Z7fUC7XGh0bDLrT31EPRaiy8x9g26UJHPu0/exec';
  const TRANSLATION_KEY = 'bible_reader_translation';

  // 성경 66권 목록 (성경명 시트 기준 고정값) — 매 로딩마다 네트워크로 가져올 필요 없는
  // 정적 데이터라 하드코딩한다. 시트의 "성경" 탭(실제 구절 본문)만 API로 조회한다.
  const booksCache = [
    { 번호: 1, 이름: '창세기', 장수: 50, 색인: '창' },
    { 번호: 2, 이름: '출애굽기', 장수: 40, 색인: '출' },
    { 번호: 3, 이름: '레위기', 장수: 27, 색인: '레' },
    { 번호: 4, 이름: '민수기', 장수: 36, 색인: '민' },
    { 번호: 5, 이름: '신명기', 장수: 34, 색인: '신' },
    { 번호: 6, 이름: '여호수아', 장수: 24, 색인: '수' },
    { 번호: 7, 이름: '사사기', 장수: 21, 색인: '삿' },
    { 번호: 8, 이름: '룻기', 장수: 4, 색인: '룻' },
    { 번호: 9, 이름: '사무엘상', 장수: 31, 색인: '삼상' },
    { 번호: 10, 이름: '사무엘하', 장수: 24, 색인: '삼하' },
    { 번호: 11, 이름: '열왕기상', 장수: 22, 색인: '왕상' },
    { 번호: 12, 이름: '열왕기하', 장수: 25, 색인: '왕하' },

    { 번호: 14, 이름: '역대하', 장수: 36, 색인: '대하' },
    { 번호: 15, 이름: '에스라', 장수: 10, 색인: '스' },
    { 번호: 16, 이름: '느헤미야', 장수: 13, 색인: '느' },
    { 번호: 17, 이름: '에스더', 장수: 10, 색인: '에' },
    { 번호: 18, 이름: '욥기', 장수: 42, 색인: '욥' },
    { 번호: 19, 이름: '시편', 장수: 150, 색인: '시' },
    { 번호: 20, 이름: '잠언', 장수: 31, 색인: '잠' },
    { 번호: 21, 이름: '전도서', 장수: 12, 색인: '전' },
    { 번호: 22, 이름: '아가', 장수: 8, 색인: '아' },
    { 번호: 23, 이름: '이사야', 장수: 66, 색인: '사' },
    { 번호: 24, 이름: '예레미야', 장수: 52, 색인: '렘' },
    { 번호: 25, 이름: '예레미야 애가', 장수: 5, 색인: '애' },
    { 번호: 26, 이름: '에스겔', 장수: 48, 색인: '겔' },
    { 번호: 27, 이름: '다니엘', 장수: 12, 색인: '단' },
    { 번호: 28, 이름: '호세아', 장수: 14, 색인: '호' },
    { 번호: 29, 이름: '요엘', 장수: 3, 색인: '욜' },
    { 번호: 30, 이름: '아모스', 장수: 9, 색인: '암' },
    { 번호: 31, 이름: '오바댜', 장수: 1, 색인: '옵' },
    { 번호: 32, 이름: '요나', 장수: 4, 색인: '욘' },
    { 번호: 33, 이름: '미가', 장수: 7, 색인: '미' },
    { 번호: 34, 이름: '나훔', 장수: 3, 색인: '나' },
    { 번호: 35, 이름: '하박국', 장수: 3, 색인: '합' },
    { 번호: 36, 이름: '스바냐', 장수: 3, 색인: '습' },
    { 번호: 37, 이름: '학개', 장수: 2, 색인: '학' },

    { 번호: 40, 이름: '마태복음', 장수: 28, 색인: '마' },
    { 번호: 41, 이름: '마가복음', 장수: 16, 색인: '막' },
    { 번호: 42, 이름: '누가복음', 장수: 24, 색인: '눅' },
    { 번호: 43, 이름: '요한복음', 장수: 21, 색인: '요' },
    { 번호: 44, 이름: '사도행전', 장수: 28, 색인: '행' },
    { 번호: 45, 이름: '로마서', 장수: 16, 색인: '롬' },
    { 번호: 46, 이름: '고린도전서', 장수: 16, 색인: '고전' },
    { 번호: 47, 이름: '고린도후서', 장수: 13, 색인: '고후' },
    { 번호: 48, 이름: '갈라디아서', 장수: 6, 색인: '갈' },
    { 번호: 49, 이름: '에베소서', 장수: 6, 색인: '엡' },
    { 번호: 50, 이름: '빌립보서', 장수: 4, 색인: '빌' },
    { 번호: 51, 이름: '골로새서', 장수: 4, 색인: '골' },
    { 번호: 52, 이름: '데살로니가전서', 장수: 5, 색인: '살전' },
    { 번호: 53, 이름: '데살로니가후서', 장수: 3, 색인: '살후' },
    { 번호: 54, 이름: '디모데전서', 장수: 6, 색인: '딤전' },
    { 번호: 55, 이름: '디모데후서', 장수: 4, 색인: '딤후' },
    { 번호: 56, 이름: '디도서', 장수: 3, 색인: '딛' },
    { 번호: 57, 이름: '빌레몬서', 장수: 1, 색인: '몬' },
    { 번호: 58, 이름: '히브리서', 장수: 13, 색인: '히' },
    { 번호: 59, 이름: '야고보서', 장수: 5, 색인: '약' },
    { 번호: 60, 이름: '베드로전서', 장수: 5, 색인: '벧전' },
    { 번호: 61, 이름: '베드로후서', 장수: 3, 색인: '벧후' },
    { 번호: 62, 이름: '요한일서', 장수: 5, 색인: '요일' },
    { 번호: 63, 이름: '요한이서', 장수: 1, 색인: '요이' },
    { 번호: 64, 이름: '요한삼서', 장수: 1, 색인: '요삼' },
    { 번호: 65, 이름: '유다서', 장수: 1, 색인: '유' },
    { 번호: 66, 이름: '요한계시록', 장수: 22, 색인: '계' }
  ];
  let chapterCache = null; // { book, chapter, verses }

  // ---- 듀얼 모드 API 호출 (Apps Script 웹뷰 / GitHub Pages 양쪽 지원) ----
  function callApi(action, params) {
    return new Promise((resolve, reject) => {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        if (action === 'getBooks') runner.getBooks();
        else if (action === 'getChapterVerses') runner.getChapterVerses(params.book, params.chapter);
        else if (action === 'submitRecord') runner.submitRecord(params.book, params.chapter, params.verse, params.date, params.author, params.content);
        else reject(new Error('unknown action: ' + action));
      } else {
        const url = new URL(APPS_SCRIPT_URL);
        url.searchParams.set('action', action);
        if (params) Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
        jsonp(url.toString()).then(data => {
          if (data && data.error) reject(new Error(data.error));
          else resolve(data);
        }).catch(reject);
      }
    });
  }

  function jsonpOnce(url) {
    return new Promise((resolve, reject) => {
      const cbName = '_cb' + Date.now() + Math.floor(Math.random() * 1e6);
      const script = document.createElement('script');
      script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
      const timeoutId = setTimeout(() => { delete window[cbName]; script.remove(); reject(new Error('시간 초과')); }, 15000);
      window[cbName] = data => { clearTimeout(timeoutId); delete window[cbName]; script.remove(); resolve(data); };
      script.onerror = () => { clearTimeout(timeoutId); delete window[cbName]; script.remove(); reject(new Error('요청 실패')); };
      document.head.appendChild(script);
    });
  }
  // Apps Script 콜드스타트/일시 오류에 대비해 최대 3회까지 시도한다.
  function jsonp(url, attempt) {
    attempt = attempt || 1;
    return jsonpOnce(url).catch(err => {
      if (attempt >= 3) throw err;
      return new Promise((resolve, reject) => {
        setTimeout(() => { jsonp(url, attempt + 1).then(resolve).catch(reject); }, 1500 * attempt);
      });
    });
  }

  // ---- 초기화 ----
  const translationSelect = document.getElementById('translationSelect');
  const bookSelect = document.getElementById('bookSelect');
  const chapterSelect = document.getElementById('chapterSelect');
  const verseSelect = document.getElementById('verseSelect');
  const resultEl = document.getElementById('result');

  const savedTranslation = localStorage.getItem(TRANSLATION_KEY);
  if (savedTranslation) translationSelect.value = savedTranslation;

  translationSelect.addEventListener('change', () => {
    localStorage.setItem(TRANSLATION_KEY, translationSelect.value);
    render();
  });

  bookSelect.addEventListener('change', () => {
    const book = booksCache.find(b => b.색인 === bookSelect.value);
    chapterCache = null;
    verseSelect.innerHTML = '<option value="">절 선택</option>';
    verseSelect.disabled = true;
    chapterSelect.innerHTML = '<option value="">장 선택</option>';
    if (!book) { chapterSelect.disabled = true; showPlaceholder(); return; }

    for (let c = 1; c <= Number(book.장수); c++) {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c + '장';
      chapterSelect.appendChild(opt);
    }
    chapterSelect.disabled = false;
    showPlaceholder();
  });

  chapterSelect.addEventListener('change', () => {
    verseSelect.innerHTML = '<option value="">전체</option>';
    verseSelect.disabled = true;
    chapterCache = null;
    if (!chapterSelect.value) { showPlaceholder(); return; }
    loadChapter();
  });

  verseSelect.addEventListener('change', render);

  function showPlaceholder() {
    resultEl.innerHTML = '<div class="placeholder">색인과 장을 선택하면 말씀을 볼 수 있어요.</div>';
  }

  function showError(msg, onRetry) {
    resultEl.innerHTML = '<div class="error">' + escapeHtml(msg) + '</div>' +
      (onRetry ? '<div style="text-align:center;margin-top:12px;"><button id="retryBtn" type="button" style="padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;">다시 시도</button></div>' : '');
    if (onRetry) document.getElementById('retryBtn').addEventListener('click', onRetry);
  }

  function loadChapter() {
    resultEl.innerHTML = '<div class="placeholder">불러오는 중...</div>';
    callApi('getChapterVerses', { book: bookSelect.value, chapter: chapterSelect.value })
      .then(data => {
        chapterCache = data;
        verseSelect.innerHTML = '<option value="">전체</option>';
        data.verses.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.절;
          opt.textContent = v.절 + '절';
          verseSelect.appendChild(opt);
        });
        verseSelect.disabled = false;
        render();
      })
      .catch(err => showError('불러오기 실패: ' + err.message, loadChapter));
  }

  function cleanText(translation, text) {
    let t = String(text || '');
    if (translation === 'ESV') t = t.replace(/\s*\(ESV\)\s*$/i, '');
    return t;
  }

  const ALL_TRANSLATIONS = ['개역개정', '새번역', 'ESV'];

  function refLabel() {
    if (!chapterCache) return '';
    const book = booksCache.find(b => b.색인 === chapterCache.book);
    const bookLabel = book ? book.이름 : chapterCache.book;
    return bookLabel + ' ' + chapterCache.chapter + '장';
  }

  function render() {
    if (!chapterCache) return;
    const translation = translationSelect.value;
    const ref = refLabel();

    const selectedVerse = verseSelect.value;
    let verses = chapterCache.verses;
    if (selectedVerse) verses = verses.filter(v => String(v.절) === String(selectedVerse));

    let html = '<div class="ref">' + escapeHtml(ref + (selectedVerse ? (' ' + selectedVerse + '절') : '')) + '</div>';
    html += verses.map(v => renderVerseLine(v, translation)).join('');
    resultEl.innerHTML = html;
  }

  function renderVerseLine(v, translation) {
    const mainText = escapeHtml(cleanText(translation, v[translation]));
    const count = v.기록수 || 0;
    const badge = count > 0 ? ' <span class="record-badge">(' + count + ')</span>' : '';

    const others = ALL_TRANSLATIONS.filter(t => t !== translation).map(t =>
      '<div class="alt-translation"><span class="alt-label">' + t + '</span>' + escapeHtml(cleanText(t, v[t])) + '</div>'
    ).join('');

    const recordSection = count > 0
      ? '<div class="record-section">' +
          '<button type="button" class="record-toggle-btn">기록 확인하기 (' + count + ')</button>' +
          '<div class="record-list hidden">' + renderRecordList(v.기록) + '</div>' +
        '</div>'
      : '';

    return '<div class="verse-line" data-verse="' + v.절 + '">' +
      '<span class="verse-num">' + v.절 + '</span>' + mainText + badge +
      '<div class="verse-expand hidden">' + others + recordSection + '</div>' +
    '</div>';
  }

  function renderRecordList(records) {
    return (records || []).map(r =>
      '<div class="record-item">' +
        '<div class="record-meta">' + escapeHtml(r.날짜) + ' · ' + escapeHtml(r.기록자) + '</div>' +
        '<div class="record-content">' + escapeHtml(r.내용) + '</div>' +
      '</div>'
    ).join('') || '<div class="record-meta">아직 기록이 없어요.</div>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---- 절 탭(번역 펼치기) / 길게 누르기(기록하기) ----
  let pressTimer = null;
  let pressingLine = null;
  let pressStartXY = null;
  let longPressFired = false;
  const LONG_PRESS_MS = 900;
  const MOVE_CANCEL_PX = 10;

  function clearPress() {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    if (pressingLine) { pressingLine.classList.remove('pressing'); pressingLine = null; }
  }

  resultEl.addEventListener('pointerdown', e => {
    const line = e.target.closest('.verse-line');
    if (!line) return;
    longPressFired = false;
    pressStartXY = [e.clientX, e.clientY];
    pressingLine = line;
    line.classList.add('pressing');
    pressTimer = setTimeout(() => {
      longPressFired = true;
      line.classList.remove('pressing');
      openRecordModal(line.dataset.verse);
    }, LONG_PRESS_MS);
  });
  resultEl.addEventListener('pointermove', e => {
    if (!pressTimer || !pressStartXY) return;
    const dx = e.clientX - pressStartXY[0], dy = e.clientY - pressStartXY[1];
    if (Math.hypot(dx, dy) > MOVE_CANCEL_PX) clearPress();
  });
  resultEl.addEventListener('pointerup', clearPress);
  resultEl.addEventListener('pointercancel', clearPress);
  resultEl.addEventListener('contextmenu', e => {
    if (e.target.closest('.verse-line')) e.preventDefault();
  });

  resultEl.addEventListener('click', e => {
    if (longPressFired) { longPressFired = false; return; } // 길게 누른 직후 발생하는 클릭은 무시

    const recordBtn = e.target.closest('.record-toggle-btn');
    if (recordBtn) {
      recordBtn.closest('.record-section').querySelector('.record-list').classList.toggle('hidden');
      return;
    }

    const line = e.target.closest('.verse-line');
    if (line) line.querySelector('.verse-expand').classList.toggle('hidden');
  });

  // ---- 기록하기 팝업 ----
  const recordModal = document.getElementById('recordModal');
  const recordModalRef = document.getElementById('recordModalRef');
  const recordDateInput = document.getElementById('recordDate');
  const recordAuthorInput = document.getElementById('recordAuthor');
  const recordContentInput = document.getElementById('recordContent');
  const recordSaveBtn = document.getElementById('recordSaveBtn');
  const recordCancelBtn = document.getElementById('recordCancelBtn');
  let modalVerseNum = null;

  function openRecordModal(verseNum) {
    modalVerseNum = verseNum;
    recordModalRef.textContent = refLabel() + ' ' + verseNum + '절';
    recordDateInput.value = new Date().toISOString().slice(0, 10);
    recordAuthorInput.value = '';
    recordContentInput.value = '';
    recordModal.classList.remove('hidden');
  }
  function closeRecordModal() {
    recordModal.classList.add('hidden');
  }
  recordCancelBtn.addEventListener('click', closeRecordModal);
  recordModal.addEventListener('click', e => {
    if (e.target === recordModal) closeRecordModal(); // 바깥 영역 탭하면 닫기
  });
  recordSaveBtn.addEventListener('click', () => {
    const date = recordDateInput.value;
    const author = recordAuthorInput.value.trim();
    const content = recordContentInput.value.trim();
    if (!author || !content) { alert('기록자와 내용을 입력해주세요.'); return; }

    recordSaveBtn.disabled = true;
    recordSaveBtn.textContent = '저장 중...';
    callApi('submitRecord', {
      book: chapterCache.book, chapter: chapterCache.chapter, verse: modalVerseNum,
      date: date, author: author, content: content
    }).then(data => {
      const v = chapterCache.verses.find(v => String(v.절) === String(modalVerseNum));
      if (v) { v.기록 = data.records; v.기록수 = data.records.length; }
      closeRecordModal();
      render();
    }).catch(err => {
      alert('저장 실패: ' + err.message);
    }).finally(() => {
      recordSaveBtn.disabled = false;
      recordSaveBtn.textContent = '저장';
    });
  });

  // ---- 책 목록 채우기 (네트워크 호출 없이 하드코딩된 목록 사용) ----
  bookSelect.innerHTML = '<option value="">책 선택</option>';
  booksCache.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b.색인;
    opt.textContent = b.번호 + '. ' + b.이름;
    bookSelect.appendChild(opt);
  });
</script>
</body>
</html>
